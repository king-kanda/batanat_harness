name: batanat

# `docker compose up -d` starts the datastores only.
# `docker compose --profile app up -d` adds migrations, api, scheduler and web.
# Host ports are non-default because this machine already runs postgres, redis
# and mongo locally; override them in .env.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batanat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batanat}
      POSTGRES_DB: ${POSTGRES_DB:-batanat}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batanat} -d ${POSTGRES_DB:-batanat}"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-batanat}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-batanat}
    ports:
      - "${MONGO_HOST_PORT:-57017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-batanat/api:local}
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-batanat}:${POSTGRES_PASSWORD:-batanat}@postgres:5432/${POSTGRES_DB:-batanat}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-batanat/api:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-batanat}:${POSTGRES_PASSWORD:-batanat}@postgres:5432/${POSTGRES_DB:-batanat}
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://${MONGO_USER:-batanat}:${MONGO_PASSWORD:-batanat}@mongo:27017
      QDRANT_URL: http://qdrant:6333
      ENABLE_SCHEDULER: "false"
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - fastembed_cache:/home/batanat/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Exactly one of these: the cron jobs are not distributed-safe.
  scheduler:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ${API_IMAGE:-batanat/api:local}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      API_HOST: 127.0.0.1
      API_PORT: 8001
      DATABASE_URL: postgresql://${POSTGRES_USER:-batanat}:${POSTGRES_PASSWORD:-batanat}@postgres:5432/${POSTGRES_DB:-batanat}
      REDIS_URL: redis://redis:6379/0
      MONGO_URL: mongodb://${MONGO_USER:-batanat}:${MONGO_PASSWORD:-batanat}@mongo:27017
      QDRANT_URL: http://qdrant:6333
      ENABLE_SCHEDULER: "true"
    volumes:
      - fastembed_cache:/home/batanat/.cache/fastembed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time; changing it needs a rebuild.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: ${WEB_IMAGE:-batanat/web:local}
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  qdrant_data:
  mongo_data:
  redis_data:
  fastembed_cache:
