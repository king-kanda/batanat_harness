name: batanat

# Host ports are non-default on purpose: this machine already runs postgres (5432),
# redis (6379) and mongo (27017) locally. Override any of them in .env if you prefer.
# Container-internal ports are always the standard ones.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-batanat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-batanat}
      POSTGRES_DB: ${POSTGRES_DB:-batanat}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batanat} -d ${POSTGRES_DB:-batanat}"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image is distroless-ish: no curl/wget. Qdrant ships a TCP-listening
      # readiness endpoint, so probe the port with bash's /dev/tcp equivalent.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-batanat}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-batanat}
    ports:
      - "${MONGO_HOST_PORT:-57017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  qdrant_data:
  mongo_data:
  redis_data:
