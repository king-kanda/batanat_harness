[project]
name = "batanat-api"
version = "0.1.0"
description = "Batanat agentic operations harness — API and agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    # web
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # logging
    "structlog>=24.4",
    # datastores
    "asyncpg>=0.30",
    "redis>=5.2",
    "pymongo>=4.13",
    "qdrant-client[fastembed]>=1.12",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "cryptography>=44.0",
    "segno>=1.6.6",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.3",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "apscheduler>=3.11.3",
]

# NOTE: this project is CPU-only. Never add torch, sentence-transformers,
# transformers or unstructured. Embeddings come from qdrant-client[fastembed]
# (ONNX/CPU) or an API provider. scripts/check-cpu-only.sh enforces this.

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/batanat_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The test database is built once per session, so the engine, the fixtures and
# the tests must all share one event loop — asyncpg connections cannot cross
# loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
