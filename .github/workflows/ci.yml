name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --all-groups

      # Must run before anything else: a GPU package in the tree is a build
      # failure, not a warning.
      - name: CPU-only guard
        run: ./scripts/check-cpu-only.sh

      - name: Lint
        working-directory: apps/api
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        working-directory: apps/api
        run: uv run pytest

      - name: Contracts are up to date
        run: |
          uv run --project apps/api python apps/api/scripts/export_contracts.py
          git diff --exit-code packages/schema/src/generated \
            || { echo "Generated contracts are stale — run 'make types' and commit."; exit 1; }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: cd apps/web && bun run typecheck

      - name: Build
        run: cd apps/web && bun run build
