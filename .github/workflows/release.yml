# Build and publish the container images.
#
# Split from ci.yml deliberately. CI runs on every pull request and must stay
# fast; this runs only when something is actually going to be deployed, and
# building two images on every push to a branch would waste minutes nobody
# reads the result of.
#
# Images go to GHCR, which needs no credential beyond the token GitHub already
# issues to the job.

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "Public API origin to bake into the web bundle"
        required: true
        default: "http://localhost:8000"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Do not publish an image for a commit that does not pass CI. `workflow_run`
  # would decouple these; requiring the same checks here keeps it obvious.
  guard:
    uses: ./.github/workflows/ci.yml

  images:
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Only the web image reads this, and it is compiled into the browser
          # bundle rather than read at runtime — so the image is tied to one API
          # origin. See the note at the top of apps/web/Dockerfile.
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url || vars.VITE_API_URL || 'http://localhost:8000' }}

      # A CPU-only image that suddenly weighs 3GB has had CUDA pulled into it.
      # The dependency guard in CI should have caught it; this is the backstop
      # that catches it arriving through a base image instead.
      - name: Image size guard
        run: |
          IMAGE="$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker pull -q "$IMAGE"
          BYTES=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "${{ matrix.name }} image: ${MB}MB"
          if [ "$MB" -gt 1200 ]; then
            echo "::error::${{ matrix.name }} image is ${MB}MB (limit 1200MB). Something large was added — check for torch/CUDA."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Deployment is scaffolding, not a working pipeline. It needs a target, and
  # there is not one yet — see TODO.md section 12. Everything above this point
  # runs today.
  # ---------------------------------------------------------------------------
  deploy:
    needs: images
    if: false # flip to `startsWith(github.ref, 'refs/tags/v')` once a host exists
    runs-on: ubuntu-latest
    environment:
      name: production
      # A protected environment is what makes this safe to arm: it can require
      # a human approval before the job runs.
    steps:
      - uses: actions/checkout@v4

      - name: Run migrations, then roll the services
        run: |
          echo "Not wired up. The shape, whatever the target ends up being:"
          echo "  1. docker compose pull"
          echo "  2. docker compose --profile app run --rm migrate"
          echo "  3. docker compose --profile app up -d api web"
          echo "  4. poll /api/health until it answers 200, roll back if it does not"
          echo
          echo "Step 2 is separate from step 3 on purpose: migrations must"
          echo "complete once, before any API replica starts, not race inside"
          echo "each of them."
