# Build both images in parallel and push them to Docker Hub.
#
# The only publishing pipeline. `ci.yml` also builds the images but never
# pushes — that job exists to catch a broken Dockerfile on the pull request
# that broke it, not to produce anything.
#
# ---------------------------------------------------------------------------
# TAGGING: every image gets a commit SHA tag as well as the moving one.
#
# A pipeline that only pushes `:api` has no way to roll back — the tag that was
# good ten minutes ago now points at the build that broke. `:main-<sha>` is
# immutable, so recovery is `docker run …:main-abc1234` rather than a revert
# commit and a seven-minute rebuild while the site is down.
# ---------------------------------------------------------------------------

name: Deploy images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      api_origin:
        description: "Public API origin to bake into the web bundle"
        required: true
        default: "https://api.batanat.okandasteven.me"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/niloticking/batanat
  # Where the VPS keeps docker-compose.prod.yml, .env and the deploy markers.
  # /srv is the FHS location for "site-specific data served by this system",
  # which is what this is — but nothing depends on it. Set a `DEPLOY_DIR` repo
  # variable to put it anywhere else.
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/batanat' }}

jobs:
  # Do not publish an image for a commit that does not pass CI. Reusing the
  # workflow rather than trusting `workflow_run` keeps the dependency visible.
  guard:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.service.name }}
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      # Both matrix legs compute the same value; the last to finish wins and
      # they agree, so which one wrote it does not matter.
      short_sha: ${{ steps.meta.outputs.sha }}

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            tag: api
            dockerfile: apps/api/Dockerfile
            # Both images build from the repo root: the web build needs the
            # workspace manifests and packages/schema, so a per-service context
            # would not see them.
            context: .

          - name: web
            tag: web
            dockerfile: apps/web/Dockerfile
            context: .

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: niloticking
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%MZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.service.tag }}
            ${{ env.IMAGE }}:${{ matrix.service.tag }}-${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.service.tag }}
          cache-to: type=gha,scope=${{ matrix.service.tag }},mode=max
          # Only the web image reads these. VITE_API_URL is compiled into the
          # browser bundle rather than read at runtime, so the image is tied to
          # one API origin — see the header of apps/web/Dockerfile.
          build-args: |
            VITE_API_URL=${{ inputs.api_origin || vars.VITE_API_URL || 'https://api.batanat.okandasteven.me' }}
            BUILD_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built }}

      # A CPU-only image that suddenly weighs 3GB has had CUDA pulled into it.
      # The dependency guard in CI should catch that; this is the backstop for
      # it arriving through a base image instead.
      - name: Image size guard
        run: |
          IMAGE_REF="${{ env.IMAGE }}:${{ matrix.service.tag }}-${{ steps.meta.outputs.sha }}"
          docker pull -q "$IMAGE_REF"
          MB=$(( $(docker image inspect "$IMAGE_REF" --format '{{.Size}}') / 1024 / 1024 ))
          echo "${{ matrix.service.name }}: ${MB}MB"
          [ "$MB" -le 1200 ] || { echo "::error::image is ${MB}MB — check for CUDA/torch"; exit 1; }

  # ---------------------------------------------------------------------------
  # Deploy over SSH.
  #
  # The VPS holds no checkout. `docker-compose.prod.yml` is copied in on every
  # deploy, so the topology comes from the commit being deployed rather than
  # from whatever was cloned there months ago. `.env` stays on the VPS and is
  # never in git or CI: it holds OAuth client secrets, and a deploy pipeline is
  # not a place to put them.
  #
  # Images are pinned to the commit SHA rather than the moving tag. `:api` works
  # today and means something else on the next run, which makes a rollback
  # ambiguous at exactly the moment it must not be.
  #
  # Every remote block uses a QUOTED heredoc, so nothing expands on the runner.
  # Values the remote needs are passed as environment variables on the ssh
  # command line — the alternative is escaping `$` by hand across two shells,
  # which is how a deploy script ends up silently substituting an empty string.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authorise SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # A pinned host key, not ssh-keyscan. Scanning on every run accepts
          # whatever answers — trust-on-first-use, repeated forever — and this
          # key has root on the box.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy the compose file
        run: |
          scp -i ~/.ssh/deploy_key -P "${{ secrets.VPS_PORT || 22 }}" \
            docker-compose.prod.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ env.DEPLOY_DIR }}/docker-compose.prod.yml"

      - name: Pull, migrate, restart
        env:
          SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          IMAGE_BASE: ${{ env.IMAGE }}
          REGISTRY_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "SHORT='$SHORT_SHA' IMAGE_BASE='$IMAGE_BASE' REGISTRY_TOKEN='$REGISTRY_TOKEN' DEPLOY_DIR='$DEPLOY_DIR' bash -seuo pipefail" <<'REMOTE'
          cd "$DEPLOY_DIR"

          export API_IMAGE="$IMAGE_BASE:api-$SHORT"
          export WEB_IMAGE="$IMAGE_BASE:web-$SHORT"

          # What is running now, so a failed health check has somewhere to go
          # back to rather than leaving the site on a broken build.
          PREVIOUS="$(cat .deployed 2>/dev/null || true)"
          echo "deploying $SHORT (previous: ${PREVIOUS:-none})"
          printf '%s\n' "${PREVIOUS}" > .previous

          printf '%s' "$REGISTRY_TOKEN" | docker login -u niloticking --password-stdin

          docker compose -f docker-compose.prod.yml pull qdrant api web
          # Once, to completion, before anything serves. If this fails nothing
          # has been restarted and the old build is still up.
          docker compose -f docker-compose.prod.yml run --rm migrate
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          printf '%s\n' "$SHORT" > .deployed
          REMOTE

      - name: Wait for health, roll back if it never comes
        env:
          SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || 22 }}
          IMAGE_BASE: ${{ env.IMAGE }}
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_TARGET" \
            "IMAGE_BASE='$IMAGE_BASE' DEPLOY_DIR='$DEPLOY_DIR' bash -seuo pipefail" <<'REMOTE'
          cd "$DEPLOY_DIR"

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "healthy after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done

          echo "API never became healthy"
          docker compose -f docker-compose.prod.yml logs --tail 60 api || true

          PREVIOUS="$(cat .previous 2>/dev/null || true)"
          if [ -n "$PREVIOUS" ]; then
            echo "rolling back to $PREVIOUS"
            export API_IMAGE="$IMAGE_BASE:api-$PREVIOUS"
            export WEB_IMAGE="$IMAGE_BASE:web-$PREVIOUS"
            docker compose -f docker-compose.prod.yml up -d
            printf '%s\n' "$PREVIOUS" > .deployed
          else
            echo "no previous deploy recorded — leaving it down rather than guessing"
          fi
          exit 1
          REMOTE

      - name: Summary
        if: always()
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
        run: |
          {
            echo "### Deployed \`$SHORT_SHA\`"
            echo
            echo "- <https://batanat.okandasteven.me>"
            echo "- <https://api.batanat.okandasteven.me/api/health>"
            echo
            echo "The login screen shows \`web $SHORT_SHA\`. Confirm from a browser that the"
            echo "deploy landed rather than assuming it did — a mismatch between the web and"
            echo "api lines means one half did not roll."
            echo
            echo "Manual rollback:"
            echo '```'
            echo "cd ${{ env.DEPLOY_DIR }}"
            echo "API_IMAGE=${{ env.IMAGE }}:api-<sha> WEB_IMAGE=${{ env.IMAGE }}:web-<sha> \\"
            echo "  docker compose -f docker-compose.prod.yml up -d"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
