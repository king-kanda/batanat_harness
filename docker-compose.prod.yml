# Production topology: app in Docker, datastores on the host.
#
# These use host networking, so `ports:` does nothing and every service must
# bind 127.0.0.1 itself. nginx is the only thing listening publicly.

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    network_mode: host
    environment:
      QDRANT__SERVICE__HOST: 127.0.0.1
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrate:
    image: ${API_IMAGE:-docker.io/niloticking/batanat:api}
    restart: "no"
    network_mode: host
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]

  api:
    image: ${API_IMAGE:-docker.io/niloticking/batanat:api}
    restart: unless-stopped
    network_mode: host
    env_file: [.env]
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 8000
      ENABLE_SCHEDULER: "false"
    volumes:
      - fastembed_cache:/home/batanat/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Exactly one of these: the cron jobs are not distributed-safe.
  scheduler:
    image: ${API_IMAGE:-docker.io/niloticking/batanat:api}
    restart: unless-stopped
    network_mode: host
    env_file: [.env]
    environment:
      API_HOST: 127.0.0.1
      API_PORT: 8001
      ENABLE_SCHEDULER: "true"
    volumes:
      - fastembed_cache:/home/batanat/.cache/fastembed
    depends_on:
      qdrant:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ${WEB_IMAGE:-docker.io/niloticking/batanat:web}
    restart: unless-stopped
    network_mode: host
    environment:
      HOST: 127.0.0.1
      PORT: 3000
    depends_on:
      api:
        condition: service_started

volumes:
  qdrant_data:
  fastembed_cache:
